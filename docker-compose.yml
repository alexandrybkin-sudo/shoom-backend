services:
  frontend:
    build:
      context: ../shoom
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID}
    restart: always
    expose:
      - "3000"
    networks:
      - shoom

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: shoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shoom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoom"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shoom

  backend:
    build:
      context: .
    restart: always
    env_file:
      - .env
    expose:
      - "3001"
    volumes:
      - avatar_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shoom
      # Dedicated IPv6 egress so the backend can reach api.telegram.org (IPv4 to
      # it is filtered on this RU host). Kept OFF the shared `shoom` network on
      # purpose: enabling IPv6 there breaks Docker's embedded DNS for the whole
      # stack (502s). Only the backend is multi-homed; nginx/frontend/postgres
      # stay IPv4-only and their service discovery is unaffected.
      - tg6

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: always
    network_mode: host
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - shoom

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  shoom:
    driver: bridge
  # IPv6-enabled egress network for the backend only (Telegram API is v6-only here).
  tg6:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:7:0::/64

volumes:
  pgdata:
  avatar_data:
