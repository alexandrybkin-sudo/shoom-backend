user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # WebSocket upgrade helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker embedded DNS — re-resolve upstreams at runtime so container
  # rebuilds (new IPs) don't strand nginx on a stale address (502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- HTTP: ACME challenge + redirect everything to HTTPS ---
  server {
    listen 80;
    listen [::]:80;
    server_name shoom.fun www.shoom.fun livekit.shoom.fun;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- Redirect www -> apex ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shoom.fun;

    ssl_certificate     /etc/letsencrypt/live/shoom.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoom.fun/privkey.pem;

    return 301 https://shoom.fun$request_uri;
  }

  # --- App: frontend (Next.js) + backend (Express / socket.io) ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shoom.fun;

    ssl_certificate     /etc/letsencrypt/live/shoom.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoom.fun/privkey.pem;

    client_max_body_size 10M;

    location /socket.io/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # --- LiveKit signaling (WSS terminated here, media goes direct over UDP) ---
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name livekit.shoom.fun;

    ssl_certificate     /etc/letsencrypt/live/shoom.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoom.fun/privkey.pem;

    location / {
      proxy_pass http://host.docker.internal:7880;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
